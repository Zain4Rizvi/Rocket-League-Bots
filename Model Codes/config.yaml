# Rocket League Goal Prediction - Training Configuration
# =======================================================

# Data Settings
# -------------
data:
  replay_data_dir: "../Replay Data"  # Path to folder containing Replay_XXX folders
  train_replays: 7  # Number of replays for training
  test_replays: 1   # Number of replays for testing
  
  # Video properties
  video_fps: 30  # FPS of recorded video
  video_speed_multiplier: 2.0  # Video filmed at 2x speed (1s gameplay = 0.5s video)
  
  # Temporal window
  lookback_seconds_gameplay: 10.0  # Look back 10 seconds of gameplay
  lookback_seconds_video: 5.0      # = 5 seconds of video (due to 2x speed)
  lookback_frames: 150             # = 5s * 30 FPS
  
  # Downsampling for efficiency
  target_fps: 10  # Downsample to 10 FPS (every 3rd frame)
  downsampled_frames: 50  # 5s * 10 FPS
  
  # Prediction settings
  prediction_interval_gameplay: 0.5  # Predict every 0.5s of gameplay
  prediction_interval_video: 0.25    # = every 0.25s of video
  prediction_interval_frames: 8      # = every 8 frames (rounded from 7.5)
  
  # Frame dimensions
  frame_height: 224  # Input height for model
  frame_width: 224   # Input width for model
  
  # Data augmentation
  augmentation:
    enabled: true
    horizontal_flip: false  # Don't flip (breaks spatial understanding)
    brightness: 0.2        # Brightness jitter
    contrast: 0.2          # Contrast jitter
    saturation: 0.1        # Saturation jitter
    temporal_jitter: 2     # Random offset ±2 frames
    random_crop: false     # Use center crop instead

# Model Architecture
# ------------------
model:
  name: "RocketLeagueGoalPredictor"
  
  # Spatial encoder (per-frame feature extraction)
  spatial_encoder:
    backbone: "efficientnet_b0"  # Options: efficientnet_b0, resnet18, resnet34
    pretrained: true
    freeze_backbone: false  # Fine-tune the backbone
    freeze_epochs: 0        # Epochs to keep frozen (0 = train from start)
  
  # Temporal encoder (sequence modeling)
  temporal_encoder:
    type: "lstm"  # Options: lstm, gru, transformer, conv1d
    hidden_size: 256
    num_layers: 2
    dropout: 0.3
    bidirectional: false  # Use unidirectional (causal prediction)
  
  # Prediction head
  prediction_head:
    hidden_dims: [128, 64]  # Dense layer dimensions
    dropout: 0.4
    activation: "relu"

# Training Settings
# -----------------
training:
  # Optimization
  epochs: 50
  batch_size: 4  # Number of video clips per batch
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: "adamw"  # Options: adam, adamw, sgd
  scheduler: "cosine"  # Options: cosine, step, plateau, none
  
  # Loss function
  loss:
    type: "focal"  # Options: focal, bce, weighted_bce, mse
    focal_alpha: 0.25
    focal_gamma: 2.0
    
  # Class imbalance handling
  sampling:
    strategy: "balanced"  # Options: balanced, weighted, all
    positive_weight: 3.0  # Oversample positive examples by this factor
    
  # Gradient clipping
  grad_clip: 1.0
  
  # Mixed precision training
  mixed_precision: true  # Use for GTX 1660
  
  # Checkpointing
  save_best: true
  save_every: 5  # Save checkpoint every N epochs
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001

# Validation Settings
# -------------------
validation:
  # Validation frequency
  val_every: 1  # Validate every N epochs
  
  # Metrics to track
  metrics:
    - "average_precision"  # Primary metric
    - "precision_at_k"     # Precision in top K predictions
    - "recall_at_k"
    - "early_detection_rate"  # % of goals detected 2s early
    - "false_alarm_rate"   # False alarms per minute
    - "mae"  # Mean absolute error
    - "rmse"  # Root mean squared error
  
  # Precision@K settings
  k_values: [0.01, 0.05, 0.1]  # Top 1%, 5%, 10% of predictions

# Logging and Output
# ------------------
logging:
  output_dir: "outputs"
  experiment_name: "rl_goal_prediction"
  
  # Tensorboard
  use_tensorboard: true
  tensorboard_dir: "runs"
  
  # Weights & Biases (optional)
  use_wandb: false
  wandb_project: "rocket-league-goal-prediction"
  
  # Logging frequency
  log_every: 10  # Log every N batches
  
  # Visualization
  save_prediction_plots: true
  plot_every: 5  # Save plots every N epochs
  num_examples_to_plot: 3  # Number of examples to visualize

# Hardware Settings
# -----------------
hardware:
  device: "cuda"  # Options: cuda, cpu, mps
  num_workers: 4  # DataLoader workers
  pin_memory: true
  
# Reproducibility
# ---------------
seed: 42

# Post-Training Evaluation
# ------------------------
evaluation:
  # Generate full predictions on all videos
  generate_full_predictions: true
  
  # Compare model distribution vs target distribution
  comparison_metrics:
    - "mse_per_video"
    - "mae_per_video"
    - "correlation_per_video"
    - "peak_alignment_error"  # How far off are the peaks?
    
  # Error analysis
  error_analysis:
    enabled: true
    save_error_distribution: true
    identify_failure_cases: true
    failure_threshold: 0.3  # MAE threshold for "failure"
